name: OpsPulse CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Audit Backend Dependencies
        run: |
          cd backend
          npm install --package-lock-only
          npm audit --audit-level=high || true

      - name: Audit Frontend Dependencies
        run: |
          cd frontend
          npm install --package-lock-only
          npm audit --audit-level=high || true

  build-and-push-docker:
    needs: audit-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/opspulse-backend:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/opspulse-backend:${{ github.run_number }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/opspulse-frontend:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/opspulse-frontend:${{ github.run_number }}
