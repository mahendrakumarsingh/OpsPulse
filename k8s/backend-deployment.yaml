apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: opspulse
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: mahendrakumarsingh/opspulse-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: opspulse-config
                  key: PORT
            - name: MONGODB_URI
              valueFrom:
                configMapKeyRef:
                  name: opspulse-config
                  key: MONGODB_URI
            - name: CLIENT_URL
              valueFrom:
                configMapKeyRef:
                  name: opspulse-config
                  key: CLIENT_URL
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: opspulse-config
                  key: NODE_ENV
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: opspulse-secret
                  key: JWT_SECRET
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: opspulse
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 30050
  type: NodePort
